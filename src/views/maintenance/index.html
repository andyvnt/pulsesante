<main class="container">
	<p class="brand">Pulse Santé</p>

	<h1>Nous revenons bientôt.</h1>

	<div class="countdown-panel" hidden aria-label="Temps estimé avant le retour du site">
		<div class="time-box">
			<span id="hours">00</span>
			<small>heures</small>
		</div>
		<div class="time-box">
			<span id="minutes">00</span>
			<small>minutes</small>
		</div>
		<div class="time-box">
			<span id="seconds">00</span>
			<small>secondes</small>
		</div>
	</div>
</main>
