<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance - Pulse Santé</title>
<style>
body {
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: radial-gradient(circle at top, #0b1d3a, #050d1f 80%);
    color:white;
    overflow:hidden;
}

/* Glow derrière */
.glow {
    position:absolute;
    width:800px;
    height:800px;
    background: radial-gradient(circle, rgba(79,195,247,0.1), transparent 70%);
    animation: pulseGlow 4s infinite;
}

@keyframes pulseGlow {
    0% { transform: scale(1); opacity:0.4; }
    50% { transform: scale(1.3); opacity:0.2; }
    100% { transform: scale(1.6); opacity:0; }
}

.container {
    text-align:center;
    z-index:2;
}

/* HERO ECG */
.hero {
    position: relative;
    width: 360px;
    height: 120px;
    margin: 0 auto 30px;
}

.hero svg {
    width:100%;
    height:100%;
}

/* ECG Path */
#ecg-path {
    stroke:#4fc3f7;
    stroke-width:3;
    fill:none;
    stroke-dasharray:1000;
    stroke-dashoffset:1000;
    animation: ecgMove 2s linear infinite;
}

@keyframes ecgMove {
    0% { stroke-dashoffset:1000; opacity:1; }
    60% { stroke-dashoffset:0; opacity:1; }
    80% { opacity:0.3; }
    100% { stroke-dashoffset:0; opacity:0; }
}

/* Loader */
.loader {
    margin:20px auto;
    width:50px;
    height:50px;
    border-radius:50%;
    border:3px solid transparent;
    border-top:3px solid #4fc3f7;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* TITRE ET TEXTE */
h1 {
    font-size:2rem;
    margin:10px 0;
    font-weight:500;
}

p {
    opacity:0.6;
    font-size:0.95rem;
}

/* COMPTEUR */
.countdown-panel {
    display:flex;
    gap:25px;
    justify-content:center;
    margin-top:30px;
}

.time-box span {
    display:block;
    font-size:2.6rem;
    font-weight:500;
    letter-spacing:1px;
    color:#e6f7ff;
    transition: all 0.25s ease;
}

.time-box small {
    font-size:0.7rem;
    opacity:0.4;
    letter-spacing:1px;
    text-transform:uppercase;
}

.separator {
    font-size:2.2rem;
    opacity:0.3;
    transform: translateY(5px);
}

.updated {
    transform: translateY(-4px);
    opacity:0.6;
}
</style>
</head>
<body>

<div class="glow"></div>

<div class="container">

    <!-- ECG -->
    <div class="hero">
        <svg viewBox="0 0 360 120">
            <path id="ecg-path" d="
                M0 60
                L40 60
                L50 30
                L60 90
                L70 60
                L120 60
                L130 40
                L140 80
                L150 60
                L300 60
                L360 60
            "/>
        </svg>
    </div>

    <div class="loader"></div>

    <h1>Maintenance en cours</h1>
    <p>Nous améliorons votre expérience.<br>Merci de patienter.</p>

    <!-- Compteur -->
    <div class="countdown-panel">
        <div class="time-box">
            <span id="hours">00</span>
            <small>heures</small>
        </div>

        <div class="separator">:</div>

        <div class="time-box">
            <span id="minutes">00</span>
            <small>minutes</small>
        </div>

        <div class="separator">:</div>

        <div class="time-box">
            <span id="seconds">00</span>
            <small>secondes</small>
        </div>
    </div>

</div>

<audio autoplay loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_8b5b1b2d5f.mp3">
</audio>

<script>
// Animation compteur
function animate(id){
    const el = document.getElementById(id);
    el.classList.add("updated");
    setTimeout(()=>el.classList.remove("updated"),200);
}

function updateCountdown(){
    try {
        const settings = JSON.parse(localStorage.getItem('pulse_maintenance_settings') || '{}');

        if (!settings.enabled) {
            window.location.href = 'index.html';
            return;
        }

        if (!settings.endTime) {
            document.getElementById("hours").textContent = '--';
            document.getElementById("minutes").textContent = '--';
            document.getElementById("seconds").textContent = '--';
            return;
        }

        const diff = new Date(settings.endTime) - new Date();

        if (diff <= 0) {
            document.body.style.transition = 'opacity 1s';
            document.body.style.opacity = '0';
            setTimeout(() => {
                window.location.replace('index.html');
            }, 1000);
            return;
        }

        const h = Math.floor(diff/(1000*60*60));
        const m = Math.floor((diff%(1000*60*60))/(1000*60));
        const s = Math.floor((diff%(1000*60))/1000);

        document.getElementById("hours").textContent = String(h).padStart(2,'0');
        document.getElementById("minutes").textContent = String(m).padStart(2,'0');
        document.getElementById("seconds").textContent = String(s).padStart(2,'0');

        animate("hours");
        animate("minutes");
        animate("seconds");
    } catch(e) {}
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
