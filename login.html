<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Admin - Pulse Santé</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f0f4fa 55%, #ddeeff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #0a1628;
        }
        .login-container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 24px 64px rgba(10, 37, 64, 0.15);
            padding: 3rem 2.5rem;
            max-width: 400px;
            width: 95%;
            text-align: center;
        }
        .login-header { margin-bottom: 2rem; }
        .login-header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            color: #0a2540;
            margin-bottom: 0.5rem;
        }
        .login-header p {
            font-size: 0.85rem;
            color: #6b8eb5;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .form-group { margin-bottom: 1.5rem; text-align: left; }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            color: #0a2540;
            margin-bottom: 0.5rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d0dce6;
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #1a73e8;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1);
        }
        .login-btn {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #1a73e8 0%, #1557b0 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 1rem;
        }
        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(26, 115, 232, 0.3);
        }
        .login-btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .error-msg {
            color: #d32f2f;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
        }
        .success-msg {
            color: #388e3c;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
        }
        .back-link { margin-top: 2rem; text-align: center; }
        .back-link a {
            color: #1a73e8;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }
        .back-link a:hover { color: #0a2540; }
        .loading { display: none; text-align: center; margin-top: 1rem; }
        .spinner {
            border: 3px solid #f0f4fa;
            border-top: 3px solid #1a73e8;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Pulse <span style="color: #1a73e8;">Santé</span></h1>
            <p>🔐 Espace Admin</p>
        </div>
        
        <div id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="admin@pulsesante.fr">
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <div id="error-msg" class="error-msg"></div>
            <div id="success-msg" class="success-msg"></div>
            <div class="loading" id="loading">
                <div class="spinner"></div>
            </div>
            <button class="login-btn" id="loginBtn" onclick="handleLogin()">Connexion</button>
        </div>

        <div class="back-link">
            <a href="index.html">← Retour au site</a>
        </div>
    </div>

    <script>
        // Hash SHA-256 des identifiants
        // Email: admin@pulsesante.fr
        // Password: Maintenance18
        const VALID_EMAIL_HASH = "d85c80218751bd4c7478a4e2f273bb61403d13b69b3e28edbaa5c3fdbef1ccba";
        const VALID_PASSWORD_HASH = "ef581d53ca991a46228d7379a303132a9bf0519e19331ad469e4a6d6489f0b2c";

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function handleLogin() {
            const emailInput = document.getElementById('email').value.trim().toLowerCase();
            const passwordInput = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');
            const loginBtn = document.getElementById('loginBtn');
            const loading = document.getElementById('loading');

            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            loginBtn.disabled = true;
            loading.style.display = 'block';

            const emailHash = await sha256(emailInput);
            const passwordHash = await sha256(passwordInput);

            if (emailHash === VALID_EMAIL_HASH && passwordHash === VALID_PASSWORD_HASH) {
                successMsg.textContent = 'Connexion réussie! Redirection...';
                successMsg.style.display = 'block';
                localStorage.setItem('pulse_admin_logged', 'true');
                localStorage.setItem('pulse_admin_email', emailInput);
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 1000);
            } else {
                errorMsg.textContent = 'Email ou mot de passe incorrect';
                errorMsg.style.display = 'block';
                loginBtn.disabled = false;
                loading.style.display = 'none';
            }
        }

        // Permettre la connexion avec Enter
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLogin();
        });
    </script>
</body>
</html>
